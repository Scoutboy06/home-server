services:
  dolt:
    # Beads' documented standalone Dolt pin; do not track latest.
    image: dolthub/dolt-sql-server:2.2.0
    container_name: beads_dolt
    restart: unless-stopped
    environment:
      DOLT_ROOT_HOST: localhost
      DOLT_ROOT_PASSWORD: ${DOLT_ROOT_PASSWORD:?Set DOLT_ROOT_PASSWORD in .env}
      DOLT_DATABASE: eden
      DOLT_USER: beads
      DOLT_USER_HOST: "%"
      DOLT_PASSWORD: ${DOLT_PASSWORD:?Set DOLT_PASSWORD in .env}
    ports:
      # Tailnet only. Never change this to 0.0.0.0.
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:3307:3306"
    volumes:
      - ./data:/var/lib/dolt
      - ./backups:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - 'dolt --no-tls --host 127.0.0.1 --port 3306 --user beads --password "$${DOLT_PASSWORD}" --use-db eden sql -q "SELECT 1" >/dev/null 2>&1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s

  scotty:
    build:
      context: ./scotty-src
      args:
        BD_VERSION: "1.3.1"
    image: beads-scotty:local
    container_name: beads_scotty
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      dolt:
        condition: service_healthy
    environment:
      BEADS_REPO: /projects/eden
      BEADS_ACTOR: elias
      BEADS_DOLT_PASSWORD: ${DOLT_PASSWORD:?Set DOLT_PASSWORD in .env}
      POSTHOG_KEY: ""
      BD_METRICS_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./scotty-projects:/projects
      - ./scotty-config:/home/nextjs/.config/bead-me-up-scotty
    expose:
      - "3000"
    labels:
      - tsdproxy.enable=true
      - tsdproxy.name=scotty
      - tsdproxy.port=3000
    networks:
      - default
      - tsdproxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  tsdproxy:
    external: true
    name: tsdproxy_default
